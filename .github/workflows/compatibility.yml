name: Compatibility tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-deps:
    runs-on: ubuntu-24.04
    outputs:
      xxfclib: ${{ steps.revisions.outputs.xxfclib }}
      cdisasm: ${{ steps.revisions.outputs.cdisasm }}
      xxwidgets: ${{ steps.revisions.outputs.xxwidgets }}
      detect_it_easy: ${{ steps.revisions.outputs.detect_it_easy }}
    steps:
      - name: Resolve dependency revisions
        id: revisions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          script: |
            const repositories = {
              xxfclib: 'xxfclib',
              cdisasm: 'cdisasm',
              xxwidgets: 'xxwidgets',
              detect_it_easy: 'Detect-It-Easy',
            };
            for (const [output, repo] of Object.entries(repositories)) {
              const { data: repository } = await github.rest.repos.get({ owner: 'horsicq', repo });
              const { data: commit } = await github.rest.repos.getCommit({
                owner: 'horsicq', repo, ref: repository.default_branch,
              });
              core.setOutput(output, commit.sha);
              core.info(`${repo}: ${commit.sha}`);
            }

  public-regressions:
    needs: resolve-deps
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out Detect-It-Easy
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GTK build and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev xvfb
      - name: Configure using pinned dependencies
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCDIE_BUILD_TESTS=ON -DCDIE_BUILD_LIBRARY=OFF
          -DXXFC_CDISASM_DIR=${{ github.workspace }}/dep/cdisasm
          -DCDIE_DATABASE_DIR=${{ github.workspace }}/dep/Detect-It-Easy
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test console and GUI backend
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Native GUI smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath build/src/gui/Debug/die.exe -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "GUI smoke test failed: $($process.ExitCode)" }
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}
          path: build/Testing/Temporary/
