name: Build NewLook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-deps:
    runs-on: ubuntu-24.04
    outputs:
      cdie: ${{ steps.revisions.outputs.cdie }}
      xxfclib: ${{ steps.revisions.outputs.xxfclib }}
      cdisasm: ${{ steps.revisions.outputs.cdisasm }}
      xxwidgets: ${{ steps.revisions.outputs.xxwidgets }}
      detect_it_easy: ${{ steps.revisions.outputs.detect_it_easy }}
    steps:
      - name: Resolve NewLook and dependency revisions
        id: revisions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          script: |
            const { data: source } = await github.rest.repos.getCommit({
              ...context.repo, ref: 'heads/NewLook',
            });
            core.setOutput('cdie', source.sha);
            core.info(`NewLook: ${source.sha}`);
            const repositories = {
              xxfclib: 'xxfclib',
              cdisasm: 'cdisasm',
              xxwidgets: 'xxwidgets',
              detect_it_easy: 'Detect-It-Easy',
            };
            for (const [output, repo] of Object.entries(repositories)) {
              const { data: repository } = await github.rest.repos.get({ owner: 'horsicq', repo });
              const { data: commit } = await github.rest.repos.getCommit({
                owner: 'horsicq', repo, ref: repository.default_branch,
              });
              core.setOutput(output, commit.sha);
              core.info(`${repo}: ${commit.sha}`);
            }

  ubuntu:
    needs: resolve-deps
    runs-on: ubuntu-24.04
    steps:
      - name: Check out cdie NewLook
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deps.outputs.cdie }}
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake unzip pkg-config libgtk-3-dev
      - name: Configure
        working-directory: cdie
        run: |
          test -d dep/Detect-It-Easy/db
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DXXFCLIB_DIR="$PWD/dep/xxfclib" \
            -DXXFC_CDISASM_DIR="$PWD/dep/cdisasm" \
            -DCDIE_DATABASE_DIR="$PWD/dep/Detect-It-Easy"
      - name: Build
        working-directory: cdie
        run: cmake --build build --parallel 2
      - name: Package Ubuntu
        working-directory: cdie
        run: |
          version=$(head -n 1 release_version.txt)
          cpack --config build/CPackConfig.cmake -G ZIP -B release \
            -D "CPACK_PACKAGE_FILE_NAME=cdie_ubuntu24_amd64_${version}"
          archive="release/cdie_ubuntu24_amd64_${version}.zip"
          test -s "$archive"
          inventory=$(mktemp)
          unzip -Z -1 "$archive" > "$inventory"
          grep -Eq '(^|/)bin/cdie$' "$inventory"
          grep -Eq '(^|/)bin/db/.+[^/]$' "$inventory"
      - name: Save Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-newlook-ubuntu24
          path: cdie/release/cdie_ubuntu24_amd64_*.zip
          if-no-files-found: error

  macos:
    needs: resolve-deps
    runs-on: macos-15
    steps:
      - name: Check out cdie NewLook
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deps.outputs.cdie }}
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Configure
        working-directory: cdie
        run: |
          test "$(uname -m)" = arm64
          test -d dep/Detect-It-Easy/db
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DXXFCLIB_DIR="$PWD/dep/xxfclib" \
            -DXXFC_CDISASM_DIR="$PWD/dep/cdisasm" \
            -DCDIE_DATABASE_DIR="$PWD/dep/Detect-It-Easy"
      - name: Build
        working-directory: cdie
        run: cmake --build build --parallel 2
      - name: Package and verify macOS
        working-directory: cdie
        run: |
          version=$(head -n 1 release_version.txt)
          cpack --config build/CPackConfig.cmake -G ZIP -B release
          archive="release/cdie_mac_arm64_portable_${version}.zip"
          test -s "$archive"

          extract_dir=$(mktemp -d)
          unzip -q "$archive" -d "$extract_dir"
          package_dir="$extract_dir/cdie_mac_arm64_portable_${version}"
          test -x "$package_dir/cdie"
          test -n "$(find "$package_dir/db" -type f -print -quit)"

          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          "$package_dir/cdie" /usr/bin/file > scan.txt
          test -s scan.txt
      - name: Save macOS package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-newlook-macos-arm64
          path: cdie/release/cdie_mac_arm64_portable_*.zip
          if-no-files-found: error

  windows:
    needs: resolve-deps
    runs-on: windows-2022
    steps:
      - name: Check out cdie NewLook
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deps.outputs.cdie }}
          path: cdie
          persist-credentials: false
      - name: Check out xxfclib
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxfclib
          ref: ${{ needs.resolve-deps.outputs.xxfclib }}
          path: cdie/dep/xxfclib
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out cdisasm
        uses: actions/checkout@v4
        with:
          repository: horsicq/cdisasm
          ref: ${{ needs.resolve-deps.outputs.cdisasm }}
          path: cdie/dep/cdisasm
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out xxwidgets
        uses: actions/checkout@v4
        with:
          repository: horsicq/xxwidgets
          ref: ${{ needs.resolve-deps.outputs.xxwidgets }}
          path: cdie/dep/xxwidgets
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Check out signature database
        uses: actions/checkout@v4
        with:
          repository: horsicq/Detect-It-Easy
          ref: ${{ needs.resolve-deps.outputs.detect_it_easy }}
          path: cdie/dep/Detect-It-Easy
          token: ${{ secrets.CDIE_DEPS_TOKEN || github.token }}
          persist-credentials: false
      - name: Build and package Windows
        shell: cmd
        working-directory: cdie
        env:
          CDIE_DATABASE_DIR: ${{ github.workspace }}\cdie\dep\Detect-It-Easy
        run: call packaging\windows\build_portable_windows.cmd x64 win64
      - name: Verify Windows package
        shell: pwsh
        working-directory: cdie
        run: |
          $packages = @(Get-ChildItem release -Filter 'cdie_win_x64_portable_*.zip')
          if ($packages.Count -ne 1) { throw "Expected one Windows ZIP, found $($packages.Count)" }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($application in @('cdie.exe', 'cdie_gui.exe')) {
              $escapedName = [regex]::Escape($application)
              if (-not ($entries | Where-Object { $_ -match "(^|/)$escapedName`$" })) {
                throw "Windows package is missing $application"
              }
            }
            if (-not ($entries | Where-Object { $_ -match '(^|/)db/.+[^/]$' })) {
              throw 'Windows package is missing the signature database'
            }
          } finally {
            $archive.Dispose()
          }
      - name: Save Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cdie-newlook-win64
          path: cdie/release/cdie_win_x64_portable_*.zip
          if-no-files-found: error
